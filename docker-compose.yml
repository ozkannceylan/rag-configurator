services:
  # ==========================================
  # Frontend Applications
  # ==========================================

  # Configurator UI (Vue 3)
  configurator-ui:
    build:
      context: ./apps/configurator-ui
      dockerfile: Dockerfile
      target: development
    container_name: rag-configurator-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://gateway:8000
    volumes:
      - ./apps/configurator-ui:/app
      - /app/node_modules
    networks:
      - rag-network
    restart: unless-stopped

  # Sandbox UI (Vue 3)
  sandbox-ui:
    build:
      context: ./apps/sandbox-ui
      dockerfile: Dockerfile
      target: development
    container_name: rag-sandbox-ui
    ports:
      - "3001:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://gateway:8000
    volumes:
      - ./apps/sandbox-ui:/app
      - /app/node_modules
    networks:
      - rag-network
    restart: unless-stopped

  # ==========================================
  # Backend Services
  # ==========================================

  # Gateway (API entry point)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rag-gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_PORT=8000
      - CONFIG_SERVICE_URL=http://config-service:8001
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - RAG_SERVICE_URL=http://rag-service:8003
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3001
      - INTER_SERVICE_SECRET=dev-inter-service-secret
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_RPS=100
      - LOG_LEVEL=info
    depends_on:
      config-service:
        condition: service_started
      rag-service:
        condition: service_started
    networks:
      - rag-network
    restart: unless-stopped

  # Config Service (FastAPI)
  config-service:
    build:
      context: .
      dockerfile: services/config-service/Dockerfile
    container_name: rag-config-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=config-service
      - CONFIG_SERVICE_PORT=8001
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/rag_configurator?authSource=admin
      - MONGODB_DATABASE=rag_configurator
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - INTER_SERVICE_SECRET=dev-inter-service-secret
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/config-service:/app
      - ./demo/sample-docs:/app/sample-docs
      - ${LOCAL_DATA_PATH:-.}:/data/local
      - /app/__pycache__
    networks:
      - rag-network
    restart: unless-stopped

  # Ingestion Service (FastAPI + Celery)
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: rag-ingestion-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=ingestion-service
      - INGESTION_SERVICE_PORT=8002
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/rag_configurator?authSource=admin
      - MONGODB_DATABASE=rag_configurator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - INTER_SERVICE_SECRET=dev-inter-service-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ingestion-service:/app
      - ./demo/sample-docs:/app/sample-docs
      - ${LOCAL_DATA_PATH:-.}:/data/local
      - ./data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # Celery Worker for Ingestion
  celery-worker:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: rag-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - SERVICE_NAME=celery-worker
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/rag_configurator?authSource=admin
      - MONGODB_DATABASE=rag_configurator
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=celery-worker
      - INTER_SERVICE_SECRET=dev-inter-service-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ingestion-service:/app
      - ./demo/sample-docs:/app/sample-docs
      - ${LOCAL_DATA_PATH:-.}:/data/local
      - ./data:/data
    networks:
      - rag-network
    restart: unless-stopped

  # RAG Service (FastAPI + LangGraph)
  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    container_name: rag-rag-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=rag-service
      - RAG_SERVICE_PORT=8003
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/rag_configurator?authSource=admin
      - MONGODB_DATABASE=rag_configurator
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://localhost:8080}
      - INTER_SERVICE_SECRET=dev-inter-service-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./services/rag-service:/app
    networks:
      - rag-network
    restart: unless-stopped

  # MongoDB for all data storage
  mongodb:
    image: mongo:7.0
    container_name: rag-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: rag_configurator
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Redis for Celery broker and caching
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # MongoDB Web UI (optional, for development)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: rag-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rag-network

  # Redis Commander (optional, for development)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rag-redis-commander
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rag-network

  # ==========================================
  # Observability (optional, enable with --profile observability)
  # ==========================================

  # Langfuse - LLM observability and tracing
  langfuse:
    image: langfuse/langfuse:2
    container_name: rag-langfuse
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3003
      - NEXTAUTH_SECRET=langfuse-secret-change-in-production
      - SALT=langfuse-salt-change-in-production
    depends_on:
      - langfuse-db
    networks:
      - rag-network
    profiles:
      - observability

  # PostgreSQL for Langfuse
  langfuse-db:
    image: postgres:15
    container_name: rag-langfuse-db
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks:
      - rag-network
    profiles:
      - observability

volumes:
  mongodb_data:
  redis_data:
  data:
  langfuse-db-data:

networks:
  rag-network:
    driver: bridge
