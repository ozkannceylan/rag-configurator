name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # Prepare Release
  # ==========================================
  
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Format changelog for GitHub Actions output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

  # ==========================================
  # Run Full Test Suite
  # ==========================================
  
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: prepare
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          pip install pytest pytest-asyncio ruff black
          for service in services/*/; do
            if [ -f "$service/requirements.txt" ]; then
              pip install -r "$service/requirements.txt"
            fi
          done

      - name: Run Python linting
        run: |
          for service in services/*/; do
            if [ -f "$service/requirements.txt" ]; then
              echo "Linting $service..."
              (cd "$service" && ruff check . && black --check .)
            fi
          done

      - name: Run Go tests
        run: |
          cd gateway
          go test -v ./...
          go vet ./...

      - name: Install Node dependencies
        run: |
          for app in apps/*/; do
            if [ -f "$app/package.json" ]; then
              (cd "$app" && npm ci)
            fi
          done

      - name: Run UI linting
        run: |
          for app in apps/*/; do
            if [ -f "$app/package.json" ]; then
              echo "Linting $app..."
              (cd "$app" && npm run lint)
            fi
          done

      - name: Run UI tests
        run: |
          for app in apps/*/; do
            if [ -f "$app/package.json" ]; then
              echo "Testing $app..."
              (cd "$app" && npm run test:coverage || true)
            fi
          done

  # ==========================================
  # Build Release Images
  # ==========================================
  
  build-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: [prepare, test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: config-service
            context: services/config-service
          - service: ingestion-service
            context: services/ingestion-service
          - service: rag-service
            context: services/rag-service
          - service: gateway
            context: gateway
          - service: configurator-ui
            context: apps/configurator-ui
          - service: sandbox-ui
            context: apps/sandbox-ui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ==========================================
  # Create GitHub Release
  # ==========================================
  
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release Package
        run: |
          # Create deployment package
          mkdir -p release/docker release/infrastructure
          
          # Copy deployment files
          cp docker/docker-compose.prod.yml release/docker/
          cp -r docker/nginx release/docker/
          cp -r infrastructure/mongo release/infrastructure/
          
          # Create README
          cat > release/README.md << 'EOF'
          # RAG Configurator ${{ needs.prepare.outputs.version }}
          
          ## Deployment
          
          1. Copy `docker-compose.prod.yml` and `nginx/` to your server
          2. Set up environment variables (see .env.example)
          3. Run: `docker-compose -f docker-compose.prod.yml up -d`
          
          ## Images
          
          All images are available at:
          - `${{ env.REGISTRY }}/${{ github.repository }}/config-service:${{ needs.prepare.outputs.version }}`
          - `${{ env.REGISTRY }}/${{ github.repository }}/ingestion-service:${{ needs.prepare.outputs.version }}`
          - `${{ env.REGISTRY }}/${{ github.repository }}/rag-service:${{ needs.prepare.outputs.version }}`
          - `${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ needs.prepare.outputs.version }}`
          - `${{ env.REGISTRY }}/${{ github.repository }}/configurator-ui:${{ needs.prepare.outputs.version }}`
          - `${{ env.REGISTRY }}/${{ github.repository }}/sandbox-ui:${{ needs.prepare.outputs.version }}`
          
          ## Changelog
          
          ${{ needs.prepare.outputs.changelog }}
          EOF
          
          # Create archive
          tar -czf rag-configurator-${{ needs.prepare.outputs.version }}.tar.gz -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            ## What's Changed
            
            ${{ needs.prepare.outputs.changelog }}
            
            ## Docker Images
            
            ```bash
            # Pull all images
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/config-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/ingestion-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/rag-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/configurator-ui:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/sandbox-ui:${{ needs.prepare.outputs.version }}
            ```
            
            ## Deployment Package
            
            Download the deployment package below for docker-compose files and configurations.
          files: |
            rag-configurator-${{ needs.prepare.outputs.version }}.tar.gz
          generate_release_notes: true

  # ==========================================
  # Update Helm Chart (Optional)
  # ==========================================
  
  update-helm:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    if: github.repository == 'your-org/rag-configurator'
    
    steps:
      - name: Checkout charts repo
        uses: actions/checkout@v4
        with:
          repository: your-org/rag-configurator-charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts

      - name: Update Helm chart
        run: |
          cd charts
          
          # Update Chart.yaml
          sed -i "s/version:.*/version: ${{ needs.prepare.outputs.version }}/" Chart.yaml
          sed -i "s/appVersion:.*/appVersion: \"${{ needs.prepare.outputs.version }}\"/" Chart.yaml
          
          # Update values.yaml with new image tags
          sed -i "s/tag:.*/tag: ${{ needs.prepare.outputs.version }}/g" values.yaml
          
          # Commit changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update to version ${{ needs.prepare.outputs.version }}"
          git push

  # ==========================================
  # Notify
  # ==========================================
  
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "🚀 Release ${{ needs.prepare.outputs.version }} published for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Release Published*\nVersion: ${{ needs.prepare.outputs.version }}\nRepository: ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }}|View Release>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
