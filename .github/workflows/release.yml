name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

# Least-privilege default for every job; widened per job where needed.
permissions:
  contents: read

jobs:
  # ==========================================
  # Prepare Release
  # ==========================================

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # Get commits since previous tag
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Multi-line step outputs need a heredoc delimiter. The old %0A/%25
          # escaping only worked with the removed `set-output` command and
          # leaked literal "%0A" into the release body.
          {
            echo "changelog<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # ==========================================
  # Run Full Test Suite
  # ==========================================

  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: gateway/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Every service imports rag_config_common.
          pip install -e shared/python
          for service in services/*/; do
            if [ -f "${service}requirements.txt" ]; then
              pip install -r "${service}requirements.txt"
            fi
            # Linters must be pinned so a release cannot fail on a new linter
            # release with no commit behind it.
            if [ -f "${service}requirements-dev.txt" ]; then
              pip install -r "${service}requirements-dev.txt"
            fi
          done
          if ! command -v ruff >/dev/null 2>&1; then
            pip install 'ruff==0.4.10'
          fi
          if ! command -v black >/dev/null 2>&1; then
            pip install 'black==24.4.2'
          fi
          ruff --version
          black --version

      - name: Run Python linting
        run: |
          for service in services/*/; do
            if [ -f "${service}requirements.txt" ]; then
              echo "Linting $service..."
              (cd "$service" && ruff check . && black --check .)
            fi
          done

      - name: Run Go tests
        run: |
          cd gateway
          go test -v ./...
          go vet ./...

      - name: Install Node dependencies
        run: |
          for app in apps/*/; do
            if [ -f "${app}package.json" ]; then
              (cd "$app" && npm ci)
            fi
          done

      - name: Run UI linting
        run: |
          for app in apps/*/; do
            if [ -f "${app}package.json" ]; then
              echo "Linting $app..."
              (cd "$app" && npm run lint)
            fi
          done

      - name: Run UI tests
        run: |
          for app in apps/*/; do
            if [ -f "${app}package.json" ]; then
              echo "Testing $app..."
              (cd "$app" && npm run test:coverage)
            fi
          done

  # ==========================================
  # Build Release Images
  # ==========================================

  build-images:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: [prepare, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # The three Python service Dockerfiles COPY `shared/python` and
        # `services/<svc>/...`, so their build context must be the repo root.
        # gateway/ and apps/*/ Dockerfiles only COPY paths relative to their own
        # directory, so their context stays that directory.
        include:
          - service: config-service
            context: .
            dockerfile: services/config-service/Dockerfile
          - service: ingestion-service
            context: .
            dockerfile: services/ingestion-service/Dockerfile
          - service: rag-service
            context: .
            dockerfile: services/rag-service/Dockerfile
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - service: configurator-ui
            context: apps/configurator-ui
            dockerfile: apps/configurator-ui/Dockerfile
          - service: sandbox-ui
            context: apps/sandbox-ui
            dockerfile: apps/sandbox-ui/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ==========================================
  # Create GitHub Release
  # ==========================================

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Release Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
        run: |
          set -e
          # Create deployment package
          mkdir -p release/docker release/infrastructure

          # Copy deployment files
          cp docker/docker-compose.prod.yml release/docker/
          cp -r docker/nginx release/docker/
          cp -r infrastructure/mongo release/infrastructure/

          # Create README
          cat > release/README.md << 'TEMPLATE_EOF'
          # RAG Configurator __VERSION__

          ## Deployment

          1. Copy `docker-compose.prod.yml` and `nginx/` to your server
          2. Set up environment variables (see .env.example)
          3. Run: `docker compose -f docker-compose.prod.yml up -d`

          ## Images

          All images are available at `__REGISTRY__/__REPO__/<service>:__VERSION__`
          for: config-service, ingestion-service, rag-service, gateway,
          configurator-ui and sandbox-ui.

          ## Changelog

          TEMPLATE_EOF

          sed -i "s|__VERSION__|${VERSION}|g; s|__REGISTRY__|${REGISTRY}|g; s|__REPO__|${GITHUB_REPOSITORY}|g" release/README.md
          printf '%s\n' "$CHANGELOG" >> release/README.md

          # Create archive
          tar -czf "rag-configurator-${VERSION}.tar.gz" -C release .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            ## What's Changed

            ${{ needs.prepare.outputs.changelog }}

            ## Docker Images

            ```bash
            # Pull all images
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/gateway:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/config-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/ingestion-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/rag-service:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/configurator-ui:${{ needs.prepare.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/sandbox-ui:${{ needs.prepare.outputs.version }}
            ```

            ## Deployment Package

            Download the deployment package below for docker-compose files and configurations.
          files: |
            rag-configurator-${{ needs.prepare.outputs.version }}.tar.gz
          generate_release_notes: true

  # ==========================================
  # Update Helm Chart (Optional)
  # ==========================================

  update-helm:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: [prepare, build-images]
    permissions:
      contents: read
    # Placeholder guard: this never runs for this repository. Point it at the
    # real charts repository (and provide CHARTS_REPO_TOKEN) to enable it.
    if: github.repository == 'your-org/rag-configurator'

    steps:
      - name: Checkout charts repo
        uses: actions/checkout@v5
        with:
          repository: your-org/rag-configurator-charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts

      - name: Update Helm chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          cd charts

          # Update Chart.yaml
          sed -i "s/version:.*/version: ${VERSION}/" Chart.yaml
          sed -i "s/appVersion:.*/appVersion: \"${VERSION}\"/" Chart.yaml

          # Update values.yaml with new image tags
          sed -i "s/tag:.*/tag: ${VERSION}/g" values.yaml

          # Commit changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update to version ${VERSION}"
          git push

  # ==========================================
  # Notify
  # ==========================================

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    # `prepare` must be in `needs`, otherwise needs.prepare.outputs.* is empty.
    needs: [prepare, create-release]
    if: always()
    permissions:
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Notify Slack
        # Skipped when the webhook secret is not configured, so a missing
        # secret cannot turn an otherwise-successful release run red.
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Release ${{ needs.prepare.outputs.version }} published for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*New Release Published*\nVersion: ${{ needs.prepare.outputs.version }}\nRepository: ${{ github.repository }}\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.version }}|View Release>"
                  }
                }
              ]
            }
