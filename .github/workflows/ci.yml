name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Python Services Lint & Test
  # ==========================================
  
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-service, ingestion-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black
          pip install -r requirements.txt

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Ruff formatting check
        run: ruff format --check .

      - name: Run Black formatting check
        run: black --check --diff .

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    needs: python-lint
    strategy:
      matrix:
        service: [config-service, ingestion-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: rag_configurator
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGODB_URI: mongodb://admin:password@localhost:27017
          MONGODB_DATABASE: rag_configurator_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # Go Gateway Lint & Test
  # ==========================================
  
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: gateway/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: gateway
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -l .
            exit 1
          fi

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: go-lint
    defaults:
      run:
        working-directory: gateway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: gateway/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./gateway/coverage.out
          flags: gateway
          name: gateway-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # TypeScript/Vue UI Lint & Test
  # ==========================================
  
  ui-lint:
    name: UI Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [configurator-ui, sandbox-ui]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx vue-tsc --noEmit

  ui-test:
    name: UI Test
    runs-on: ubuntu-latest
    needs: ui-lint
    strategy:
      matrix:
        app: [configurator-ui, sandbox-ui]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # E2E Tests with Docker Compose
  # ==========================================
  
  e2e-test:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: [python-test, go-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        run: |
          cd docker
          docker-compose up -d --build
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check health
          docker-compose ps

      - name: Run health checks
        run: |
          # Test Gateway
          curl -f http://localhost:8000/health || exit 1
          
          # Test Config Service
          curl -f http://localhost:8001/health || exit 1
          
          # Test Ingestion Service
          curl -f http://localhost:8002/health || exit 1
          
          # Test RAG Service
          curl -f http://localhost:8003/health || exit 1

      - name: Run API integration tests
        run: |
          # Test auth flow
          curl -X POST http://localhost:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"TestPass123!","name":"Test User"}'
          
          # Test login
          TOKEN=$(curl -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"TestPass123!"}' | jq -r '.data.access_token')
          
          # Test authenticated endpoint
          curl -f http://localhost:8000/api/v1/users/me \
            -H "Authorization: Bearer $TOKEN" || exit 1

      - name: Cleanup
        if: always()
        run: |
          cd docker
          docker-compose down -v
          docker-compose logs > docker-compose-logs.txt 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker/docker-compose-logs.txt

  # ==========================================
  # Docker Build Test
  # ==========================================
  
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: config-service
            context: services/config-service
          - service: ingestion-service
            context: services/ingestion-service
          - service: rag-service
            context: services/rag-service
          - service: gateway
            context: gateway
          - service: configurator-ui
            context: apps/configurator-ui
          - service: sandbox-ui
            context: apps/sandbox-ui
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs
        run: |
          # Quick smoke test - just check if container starts
          docker run --rm -d --name test-${{ matrix.service }} ${{ matrix.service }}:test || true
          sleep 5
          docker stop test-${{ matrix.service }} || true

  # ==========================================
  # Security Scan
  # ==========================================
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # Summary
  # ==========================================
  
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-test, go-test, ui-test, e2e-test, docker-build]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check all jobs status
        run: |
          echo "Python Tests: ${{ needs.python-test.result }}"
          echo "Go Tests: ${{ needs.go-test.result }}"
          echo "UI Tests: ${{ needs.ui-test.result }}"
          echo "E2E Tests: ${{ needs.e2e-test.result }}"
          echo "Docker Builds: ${{ needs.docker-build.result }}"
          
          if [[ "${{ needs.python-test.result }}" == "failure" ]] || \
             [[ "${{ needs.go-test.result }}" == "failure" ]] || \
             [[ "${{ needs.ui-test.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-test.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "❌ CI failed"
            exit 1
          else
            echo "✅ CI passed"
          fi
