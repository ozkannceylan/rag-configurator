name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job; widened per job where needed.
permissions:
  contents: read

jobs:
  # ==========================================
  # Python Services Lint & Test
  # ==========================================

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Show every service's failures in one run instead of cancelling siblings.
      fail-fast: false
      matrix:
        service: [config-service, ingestion-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Linters must be pinned so CI cannot drift red without a commit.
          # requirements-dev.txt is the source of truth when it exists.
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install 'ruff==0.4.10' 'black==24.4.2'
          fi

      - name: Show tool versions
        run: |
          ruff --version
          black --version

      - name: Run Ruff linting
        run: ruff check .

      # Formatting is checked by black only. Running `ruff format --check`
      # alongside black puts two formatters in competition over the same files.
      - name: Run Black formatting check
        run: black --check --diff .

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    needs: python-lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [config-service, ingestion-service, rag-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: rag_configurator
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Every service imports rag_config_common; it is not in requirements.txt.
          pip install -e ../../shared/python
          # pytest, pytest-asyncio, pytest-cov and httpx are already pinned in
          # each service's requirements.txt - do not re-install them unpinned.
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run tests
        env:
          MONGODB_URI: mongodb://admin:password@localhost:27017
          MONGODB_DATABASE: rag_configurator_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # Go Gateway Lint & Test
  # ==========================================

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: gateway/go.sum

      # golangci-lint-action v6 is the last major that supports golangci-lint
      # v1.x. v7+ requires golangci-lint v2 and a v2-format config file.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: gateway
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Go code is not formatted:"
            gofmt -l .
            exit 1
          fi

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: go-lint
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache-dependency-path: gateway/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./gateway/coverage.out
          flags: gateway
          name: gateway-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # TypeScript/Vue UI Lint & Test
  # ==========================================

  ui-lint:
    name: UI Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [configurator-ui, sandbox-ui]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx vue-tsc --noEmit

  ui-test:
    name: UI Test
    runs-on: ubuntu-latest
    needs: ui-lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [configurator-ui, sandbox-ui]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./apps/${{ matrix.app }}/coverage/coverage-final.json
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # E2E Tests with Docker Compose
  # ==========================================

  e2e-test:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: [python-test, go-test]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The root docker-compose.yml is the only compose file with correct build
      # contexts. The `docker-compose` v1 binary no longer exists on the runner,
      # so everything below uses the `docker compose` plugin.
      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml up -d --build \
            gateway config-service ingestion-service rag-service celery-worker
          docker compose -f docker-compose.yml ps

      - name: Wait for services to become healthy
        run: |
          set -uo pipefail
          timeout_seconds=300
          deadline=$(( $(date +%s) + timeout_seconds ))
          for port in 8000 8001 8002 8003; do
            echo "Waiting for http://localhost:${port}/health ..."
            until curl -fsS "http://localhost:${port}/health" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::No healthy response from http://localhost:${port}/health within ${timeout_seconds}s"
                docker compose -f docker-compose.yml ps
                docker compose -f docker-compose.yml logs --no-color --tail=200
                exit 1
              fi
              sleep 5
            done
            echo "  OK - port ${port} is healthy"
          done
          echo "All services healthy."

      - name: Install E2E test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      # The real E2E suite lives in tests/e2e/ - run it instead of ad-hoc curls.
      - name: Run E2E test suite
        run: pytest tests/e2e/

      # Logs must be captured BEFORE the stack is torn down, otherwise the
      # uploaded artifact is always empty.
      - name: Collect service logs
        if: always()
        run: |
          docker compose -f docker-compose.yml logs --no-color > docker-compose-logs.txt 2>&1 || true
          docker compose -f docker-compose.yml ps >> docker-compose-logs.txt 2>&1 || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans

  # ==========================================
  # Docker Build Test
  # ==========================================

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The three Python service Dockerfiles COPY `shared/python` and
        # `services/<svc>/...`, so their build context must be the repo root.
        # gateway/ and apps/*/ Dockerfiles only COPY paths relative to their own
        # directory, so their context stays that directory.
        include:
          - service: config-service
            context: .
            dockerfile: services/config-service/Dockerfile
          - service: ingestion-service
            context: .
            dockerfile: services/ingestion-service/Dockerfile
          - service: rag-service
            context: .
            dockerfile: services/rag-service/Dockerfile
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - service: configurator-ui
            context: apps/configurator-ui
            dockerfile: apps/configurator-ui/Dockerfile
          - service: sandbox-ui
            context: apps/sandbox-ui
            dockerfile: apps/sandbox-ui/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Test image runs
        run: |
          # Quick smoke test - just check if the container starts.
          docker run --rm -d --name test-${{ matrix.service }} ${{ matrix.service }}:test || true
          sleep 5
          docker stop test-${{ matrix.service }} || true

  # ==========================================
  # Security Scan
  # ==========================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # upload-sarif writes to the code-scanning API and needs this scope;
    # without it the job gets a read-only token and fails.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # Summary
  # ==========================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [python-test, go-test, ui-test, e2e-test, docker-build]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check all jobs status
        run: |
          echo "Python Tests: ${{ needs.python-test.result }}"
          echo "Go Tests: ${{ needs.go-test.result }}"
          echo "UI Tests: ${{ needs.ui-test.result }}"
          echo "E2E Tests: ${{ needs.e2e-test.result }}"
          echo "Docker Builds: ${{ needs.docker-build.result }}"

          if [[ "${{ needs.python-test.result }}" != "success" ]] || \
             [[ "${{ needs.go-test.result }}" != "success" ]] || \
             [[ "${{ needs.ui-test.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-test.result }}" != "success" ]] || \
             [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "CI failed"
            exit 1
          else
            echo "CI passed"
          fi
