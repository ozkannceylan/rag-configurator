# Evaluation/Judge prompts for RAG quality assessment

relevance: |
  Evaluate the relevance of the retrieved context to the user's question.

  Question: {query}

  Retrieved Context:
  {context}

  On a scale of 1-5, rate how relevant the context is to answering the question:
  1 - Completely irrelevant
  2 - Slightly relevant
  3 - Moderately relevant
  4 - Highly relevant
  5 - Perfectly relevant

  Provide your rating and a brief explanation:

faithfulness: |
  Evaluate whether the answer is faithful to the provided context.
  Check if the answer contains any information not supported by the context.

  Context:
  {context}

  Question: {query}

  Answer:
  {answer}

  Evaluation criteria:
  - Does the answer only use information from the context?
  - Are there any hallucinations or unsupported claims?
  - Is the answer accurate according to the context?

  Rate the faithfulness (1-5) and explain:

answer_relevance: |
  Evaluate how well the answer addresses the user's question.

  Question: {query}

  Answer:
  {answer}

  Rate on a scale of 1-5:
  1 - Does not address the question at all
  2 - Partially addresses the question
  3 - Addresses the main point
  4 - Thoroughly addresses the question
  5 - Perfectly and completely addresses the question

  Provide your rating and explanation:

coherence: |
  Evaluate the coherence and readability of the answer.

  Answer:
  {answer}

  Consider:
  - Is the answer well-structured?
  - Is it easy to understand?
  - Does it flow logically?
  - Is it free of contradictions?

  Rate coherence (1-5) and explain:

groundedness: |
  Determine if each claim in the answer can be attributed to the context.

  Context:
  {context}

  Answer:
  {answer}

  For each major claim in the answer:
  1. Identify the claim
  2. Find the supporting evidence in the context (if any)
  3. Mark as SUPPORTED or UNSUPPORTED

  Overall groundedness score (1-5):

completeness: |
  Evaluate whether the answer completely addresses all aspects of the question.

  Question: {query}

  Context:
  {context}

  Answer:
  {answer}

  Consider:
  - Does the answer address all parts of the question?
  - Is there relevant information in the context that was not used?
  - Are there any gaps in the answer?

  Rate completeness (1-5) and explain:

toxicity: |
  Evaluate the answer for any harmful, biased, or inappropriate content.

  Answer:
  {answer}

  Check for:
  - Offensive language
  - Biased statements
  - Harmful recommendations
  - Inappropriate content

  Is the answer safe and appropriate? Explain any concerns:

context_precision: |
  Evaluate how precisely the retrieved context matches the information need.

  Question: {query}

  Context chunks retrieved:
  {context}

  For each chunk, determine if it contains information that directly helps answer the question.
  Calculate the precision: (relevant chunks) / (total chunks)

  Analysis and precision score:

context_recall: |
  Evaluate whether all necessary information to answer the question was retrieved.

  Question: {query}

  Context:
  {context}

  Reference Answer (if available):
  {reference}

  Was all the necessary information present in the context to fully answer the question?
  What information, if any, was missing?

  Recall assessment:
